services:
  db:
    build: ./db
    container_name: taskmanager_db
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: taskmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskmanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: taskmanager_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://taskuser:taskpass@db:5432/taskmanager
      SECRET_KEY: dev-secret-key-change-in-production
      ALGORITHM: HS256
      # CORS_ORIGINS will include localhost where the frontend runs
      CORS_ORIGINS: '["http://localhost", "http://localhost:5173", "http://localhost:8000"]'
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m src.seed_data &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    container_name: taskmanager_frontend
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data: